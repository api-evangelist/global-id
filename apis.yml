name: Global ID
description: >-
  GlobaliD (global.id) is a decentralized digital-identity platform that lets
  people create a portable, self-sovereign identity and lets developers add
  "Sign in with GlobaliD" login, issue verifiable credentials, and verify
  identity claims (such as proof of being 18+) through server-side issuer and
  verifier toolkits built on Hyperledger Aries. Developers create apps in the
  invitation-based developer portal to obtain OAuth2 client credentials, then
  integrate using the official @globalid npm SDKs. Surfaced in the API
  Evangelist network as a portfolio company of 500 Global.
